<div class="space-y-5">

    <section class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white/70 backdrop-blur-xl border border-gray-100 rounded-2xl shadow-sm p-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Tests Catalog</h2>
            <p class="text-gray-500 text-sm mt-1">
                Manage the lab tests offered for patient booking.
            </p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <p-button label="Add Test" icon="pi pi-plus" styleClass="bg-violet-500! hover:bg-violet-600! border-violet-500! hover:border-violet-600!" severity="success" (onClick)="openAddTestDialog()">
            </p-button>
        </div>
    </section>

    <section class="bg-white/70 backdrop-blur-xl border border-gray-100 rounded-2xl shadow-sm p-5">
        @if (tests().length) {
        <div class="grid gap-4">
            @for (test of tests(); track $index; let i = $index) {
            <article class="rounded-2xl bg-gray-50 border border-gray-100 p-4 flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="flex-1 min-w-0">
                    <h4 class="font-semibold text-gray-800 truncate">{{ test.testName }}</h4>
                    <p class="mt-1 text-sm text-gray-500 line-clamp-2">{{ test.testDetails }}</p>
                </div>
                <div class="shrink-0 text-right">
                    <p class="text-lg font-bold text-violet-600">{{ test.price }} <span class="text-sm font-normal text-gray-400">EGP</span></p>
                </div>
                <div class="shrink-0 flex items-center gap-2">
                    <p-button label="Edit" icon="pi pi-pencil" severity="secondary" size="small" outlined (onClick)="openEditDialog(i)"></p-button>
                    <p-button label="Delete" icon="pi pi-trash" severity="danger" size="small" outlined (onClick)="deleteTest(i)"></p-button>
                </div>
            </article>
            }
        </div>
        } @else {
        <div class="rounded-2xl border border-dashed border-gray-200 bg-white/60 p-6 text-sm text-gray-500 text-center">
            No tests added yet. Click "Add Test" to create your catalog.
        </div>
        }
    </section>

    <!-- Add / Edit Test Dialog -->
    <p-dialog [header]="editingIndex() !== null ? 'Edit Test' : 'Add Test'" [modal]="true" [visible]="addTestDialogVisible()" (visibleChange)="addTestDialogVisible.set($event)" [draggable]="false" [resizable]="false" [style]="{ width: 'min(96vw, 560px)' }">
        <div class="flex flex-col gap-5">
            <label class="space-y-1">
                <span class="text-sm font-semibold text-gray-700">Test Name *</span>
                <input pInputText class="w-full" [(ngModel)]="newTestName" placeholder="e.g. Complete Blood Count" />
            </label>
            <label class="space-y-1">
                <span class="text-sm font-semibold text-gray-700">Price (EGP)</span>
                <input pInputText class="w-full" [(ngModel)]="newTestPrice" placeholder="e.g. 200" />
            </label>
            <label class="space-y-1">
                <span class="text-sm font-semibold text-gray-700">Details</span>
                <textarea pInputTextarea class="w-full" rows="3" [(ngModel)]="newTestDetails" placeholder="Describe what this test measures..."></textarea>
            </label>

        </div>
        <ng-template #footer>
            <p-button label="Cancel" severity="secondary" outlined (onClick)="addTestDialogVisible.set(false)"></p-button>
            <p-button [label]="editingIndex() !== null ? 'Update Test' : 'Add Test'" [icon]="editingIndex() !== null ? 'pi pi-check' : 'pi pi-plus'" styleClass="bg-violet-500! hover:bg-violet-600! border-violet-500!" severity="success" (onClick)="saveTest()"></p-button>
        </ng-template>
    </p-dialog>

    <p-toast />
</div>
