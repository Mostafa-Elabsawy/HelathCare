<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4">

    <div class="w-full max-w-md bg-white/70 backdrop-blur-xl border border-gray-100 shadow-lg rounded-2xl p-8">
        <div class="flex flex-col items-center mb-6">
            <div class="bg-blue-500 p-3 rounded-xl shadow mb-3">
                <i class="fa-solid fa-heart-pulse text-white text-xl"></i>
            </div>

            <h1 class="text-2xl font-bold text-gray-800">Medical Pulse</h1>
            <h1 class="text-base tracking-widest font-normal text-gray-400">system login portal</h1>
        </div>
        <form [formGroup]="loginData" class="space-y-4" (ngSubmit)="onSubmit()">

            <!-- Email -->
            <div>
                <label class="text-sm text-gray-600 mb-1 block">Email</label>
                <input pInputText formControlName="email" placeholder="Enter your email" [fluid]="true" />
            </div>
            <!-- password -->
            <div>
                <label class="text-sm text-gray-600 mb-1 block">Password</label>
                <input pInputText formControlName="password" placeholder="Enter your password" [fluid]="true" />
            </div>
            <!-- Roles -->
            <div class="flex justify-start gap-4">
                <div class="flex justify-center gap-2 items-center">

                    <p-radiobutton name="mode" value="patient" formControlName="role" inputId="role" />
                    <label for="role">Patient</label>
                </div>
                <div class="flex justify-center gap-2 items-center">
                    <p-radiobutton name="mode" value="doctor" formControlName="role" inputId="role" />
                    <label for="role">Doctor</label>
                </div>
                <div class="flex justify-center gap-2 items-center">
                    <p-radiobutton name="mode" value="lab" formControlName="role" inputId="role" />
                    <label for="role">Lab</label>
                </div>
            </div>
            <!-- Login extras -->
            <div class="flex items-center justify-between text-sm">
                <a href="#" class="text-blue-500 hover:underline">
                    Forgot password?
                </a>
            </div>
            <button pButton [rounded]="true" [type]="onSubmit" severity="primary" label="Login" [fluid]="true"></button>

        </form>
        <p class="text-center text-sm text-gray-500 mt-5">
            {{ "Don't have an account?"}}
            <button class="text-blue-500 hover:underline ml-1 cursor-pointer">
                {{"Register"}}
            </button>
        </p>
    </div>
</section>
